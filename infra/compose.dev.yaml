# Local development services only. Production compose lands in PR #5.
# Usage: docker compose -f infra/compose.dev.yaml up -d

name: portfolio-dev

services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: portfolio
      POSTGRES_PASSWORD: portfolio
      POSTGRES_DB: portfolio
    ports:
      - '5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U portfolio']
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres-data:
