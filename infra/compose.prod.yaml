# Production stack for the Hostinger VPS.
# Run from the repo root: docker compose -f infra/compose.prod.yaml up -d --build
# Expects infra/.env to exist (copy infra/prod.env.example) and DNS for
# alexandregiraud.tech / www / api already pointed at this host.
#
# TLS + reverse proxy are handled by the Traefik instance already running on
# this VPS for other services (network_mode: host, Docker label discovery,
# cert resolver "letsencrypt") — this stack does not run its own proxy, it
# just exposes labels for that Traefik to pick up. See docs/deployment.md.

name: portfolio-prod

services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: portfolio
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in infra/.env}
      POSTGRES_DB: portfolio
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U portfolio']
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ..
      dockerfile: infra/docker/api.Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      # Overrides infra/.env: the API always talks to Postgres over the
      # compose network, never over a public address.
      DATABASE_URL: postgresql://portfolio:${POSTGRES_PASSWORD}@postgres:5432/portfolio?schema=public
    depends_on:
      postgres:
        condition: service_healthy
    labels:
      - traefik.enable=true
      - traefik.http.routers.portfolio-api.rule=Host(`api.alexandregiraud.tech`)
      - traefik.http.routers.portfolio-api.entrypoints=websecure
      - traefik.http.routers.portfolio-api.tls.certresolver=letsencrypt
      - traefik.http.services.portfolio-api.loadbalancer.server.port=4000

  web:
    build:
      context: ..
      dockerfile: infra/docker/web.Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-https://api.alexandregiraud.tech}
    restart: unless-stopped
    depends_on:
      - api
    labels:
      - traefik.enable=true
      - traefik.http.routers.portfolio-web.rule=Host(`alexandregiraud.tech`) || Host(`www.alexandregiraud.tech`)
      - traefik.http.routers.portfolio-web.entrypoints=websecure
      - traefik.http.routers.portfolio-web.tls.certresolver=letsencrypt
      - traefik.http.services.portfolio-web.loadbalancer.server.port=3000

volumes:
  postgres-data:
